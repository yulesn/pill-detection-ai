data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 57  # 알약 56종(원본 대회 데이터) + 배경(0번) 1
  max_objects_per_image: 4

model:
  framework: torchvision
  name: retinanet_resnet50_fpn_v2
  pretrained: true

train:
  epochs: 50
  batch_size: 8
  learning_rate: 0.0001
  lr_patience: 5
  lr_factor: 0.5
  seed: 42
  device: cuda

predict:
  score_threshold: 0.5

output:
  dir: outputs
  experiment_name: retinanet
