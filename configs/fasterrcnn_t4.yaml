# 기본 설정 파일. 새 실험을 시작할 때는 이 파일을 복사해서
# configs/exp2.yaml 처럼 이름을 바꾸고 값만 수정해서 사용한다.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 57  # 알약 56종 + 배경(0번) 1
  max_objects_per_image: 4

model:
  framework: torchvision
  name: fasterrcnn_resnet50_fpn_v2
  pretrained: true

train:
  epochs: 100
  batch_size: 8
  learning_rate: 0.001
  seed: 42
  device: cuda

output:
  dir: outputs
  experiment_name: fasterrcnn_t4