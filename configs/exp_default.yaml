data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 26
  max_objects_per_image: 4

model:
  framework: torchvision
  name: retinanet_resnet50_fpn
  pretrained: true

train:
  epochs: 30
  batch_size: 4
  learning_rate: 0.0001
  seed: 42
  device: mps

output:
  dir: outputs
  experiment_name: retinanet