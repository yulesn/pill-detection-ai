
data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 56
  max_objects_per_image: 4
  val_ratio: 0.2 # train/val split 시 val로 뺄 비율 (prepare_split.py)

model:
  framework: torchvision
  name: fasterrcnn_resnet50_fpn
  pretrained: true
  freeze_backbone: true # backbone(resnet50) 가중치를 얼려서 학습 속도를 높임

train:
  epochs: 50
  batch_size: 8
  learning_rate: 0.001
  seed: 42
  device: cpu

predict:
  score_threshold: 0.5

output:
  dir: outputs
  experiment_name: default
