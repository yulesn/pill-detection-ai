
data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 56
  max_objects_per_image: 4
  val_ratio: 0.2 # train/val split 시 val로 뺄 비율 (prepare_split.py)

model:
  framework: torchvision
  name: fasterrcnn_resnet50_fpn
  pretrained: true

train:
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  seed: 42
  device: cuda 

output:
  dir: outputs
  experiment_name: default
