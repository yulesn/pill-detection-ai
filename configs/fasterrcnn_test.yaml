
data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 57 # 알약 56종 + 배경(0)
  max_objects_per_image: 4
  val_ratio: 0.2 # train/val split 시 val로 뺄 비율 (prepare_split.py)

model:
  framework: torchvision
  name: fasterrcnn_resnet50_fpn_v2
  pretrained: true
  freeze_backbone: false 

train:
  epochs: 100
  batch_size: 8
  learning_rate: 0.001
  lr_patience: 5 
  lr_factor: 0.5 
  seed: 42
  device: cpu

predict:
  score_threshold: 0.3

output:
  dir: outputs
  experiment_name: fasterrcnn_exp
