# 기본 설정 파일. 새 실험을 시작할 때는 이 파일을 복사해서
# configs/exp2.yaml 처럼 이름을 바꾸고 값만 수정해서 사용한다.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 56 # TODO: 알약 클래스 개수 확정되면 채우기 (실제 약품 class 수)
  max_objects_per_image: 4

model:
  framework: torchvision # TODO: yolo 또는 torchvision 중 팀에서 채택한 트랙으로 채우기
  name: retinanet_resnet50_fpn_v2 # TODO: 팀에서 프레임워크/모델 결정 후 채우기 (예: yolov8s, fasterrcnn_resnet50_fpn)
  pretrained: true

train:
  epochs: 20
  batch_size: 8
  learning_rate: 0.0001
  seed: 42
  device: mps # 학습 서버에서는 cuda로 변경

output:

  dir: outputs
  experiment_name: default
