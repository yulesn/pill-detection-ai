data:
  raw_dir: data/raw
  processed_dir: data/processed
  num_classes: 119   # 알약 118종 + 배경(0번) 1
  max_objects_per_image: 4

model:
  framework: torchvision
  name: fasterrcnn_resnet50_fpn_v2
  pretrained: true

train:
  epochs: 10
  batch_size: 8
  learning_rate: 0.005
  seed: 42
  device: cuda

output:
  dir: outputs
  experiment_name: fasterrcnn_t5